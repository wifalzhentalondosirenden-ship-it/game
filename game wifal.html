
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galactic Strike</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050817;color:white;
 font-family:Arial,sans-serif;overflow:hidden;
}
#game{
 width:100vw;height:100dvh;display:block;
 background:radial-gradient(circle at center,#14264c,#050817 75%);
}
.hud{
 position:absolute;top:12px;left:12px;right:12px;
 display:flex;justify-content:space-between;gap:8px;
 pointer-events:none;flex-wrap:wrap;
}
.panel{
 background:#0b1734cc;border:1px solid #29cfff66;
 padding:10px 15px;border-radius:12px;
 box-shadow:0 0 15px #00bfff22;
 font-size:14px;
}
#health{color:#50ff9a}
#overlay{
 position:absolute;inset:0;display:flex;
 align-items:center;justify-content:center;
 background:#020611c9;padding:20px;
}
.menu{
 text-align:center;width:min(420px,100%);
 padding:30px 20px;background:#101d3bea;
 border:1px solid #21caff88;border-radius:22px;
 box-shadow:0 0 40px #00bfff33;
}
h1{font-size:34px;color:#45dcff;margin:5px}
.menu p{color:#b8c9e9;line-height:1.6}
button{
 border:0;padding:13px 23px;border-radius:12px;
 background:linear-gradient(90deg,#087bff,#00d9ff);
 color:white;font-weight:bold;font-size:16px;
 cursor:pointer;margin:5px;
}
button:active{transform:scale(.95)}
#controls{
 position:absolute;bottom:18px;left:0;right:0;
 display:flex;justify-content:space-between;
 padding:0 20px;pointer-events:none;
}
.control{
 pointer-events:auto;width:65px;height:65px;
 border-radius:50%;background:#183e67aa;
 border:2px solid #4ddfff;color:white;
 font-size:25px;touch-action:none;
 user-select:none;
}
#fire{background:#a32850bb;border-color:#ff6b9c}
#pause{
 position:absolute;top:75px;right:15px;
 font-size:12px;padding:9px 13px;
}
@media(min-width:800px){
 #controls{opacity:.55}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
 <div class="panel">⭐ SKOR: <b id="score">0</b></div>
 <div class="panel">🌊 LEVEL: <b id="level">1</b></div>
 <div class="panel">❤️ NYAWA: <b id="health">100</b></div>
</div>

<button id="pause" onclick="pauseGame()">Ⅱ PAUSE</button>

<div id="overlay">
 <div class="menu">
  <h1>🚀 GALACTIC STRIKE</h1>
  <p>Masuki arena luar angkasa dan hadapi pasukan robot musuh. Bertahanlah selama mungkin dan raih skor tertinggi!</p>
  <p>🎮 PC: WASD / tombol panah untuk bergerak, SPACE untuk menembak.</p>
  <p>📱 HP: Gunakan tombol arah dan tombol tembak.</p>
  <button onclick="startGame()">MULAI GAME</button>
 </div>
</div>

<div id="controls">
 <div>
  <div style="display:flex;gap:8px;margin-bottom:7px">
   <button class="control" data-key="ArrowUp">↑</button>
  </div>
  <div style="display:flex;gap:8px">
   <button class="control" data-key="ArrowLeft">←</button>
   <button class="control" data-key="ArrowDown">↓</button>
   <button class="control" data-key="ArrowRight">→</button>
  </div>
 </div>
 <button class="control" id="fire">✦</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W,H;
function resize(){
 W=canvas.width=innerWidth*devicePixelRatio;
 H=canvas.height=innerHeight*devicePixelRatio;
}
resize();
addEventListener("resize",resize);

let player,bullets,enemies,particles,stars;
let score=0,level=1,health=100;
let running=false,paused=false,keys={};
let lastShot=0,spawnTimer=0,frame=0;
let best=Number(localStorage.getItem("galacticBest")||0);

function reset(){
 player={x:W/2,y:H*.78,r:17,speed:5.5};
 bullets=[];enemies=[];particles=[];
 score=0;level=1;health=100;
 spawnTimer=0;frame=0;
 stars=Array.from({length:110},()=>({
  x:Math.random()*W,y:Math.random()*H,
  s:Math.random()*2+0.5,v:Math.random()*2+0.5
 }));
 updateHUD();
}

function updateHUD(){
 document.getElementById("score").textContent=score;
 document.getElementById("level").textContent=level;
 document.getElementById("health").textContent=health;
}

function startGame(){
 reset();running=true;paused=false;
 document.getElementById("overlay").style.display="none";
 requestAnimationFrame(loop);
}

function pauseGame(){
 if(!running)return;
 paused=!paused;
 if(paused){
  document.querySelector("#overlay h1").textContent="GAME PAUSED";
  document.querySelector("#overlay p").textContent="Permainan sedang dijeda.";
  document.querySelector("#overlay button").textContent="LANJUTKAN";
  document.querySelector("#overlay button").onclick=pauseGame;
  document.getElementById("overlay").style.display="flex";
 }else{
  document.getElementById("overlay").style.display="none";
  requestAnimationFrame(loop);
 }
}

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==="Space"){keys.fire=true;e.preventDefault()}
});
addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
 if(e.code==="Space")keys.fire=false;
});

document.querySelectorAll("[data-key]").forEach(btn=>{
 const k=btn.dataset.key.toLowerCase();
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[k]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>
  btn.addEventListener(ev,()=>keys[k]=false));
});
const fire=document.getElementById("fire");
fire.addEventListener("pointerdown",e=>{e.preventDefault();keys.fire=true});
["pointerup","pointerleave","pointercancel"].forEach(ev=>
 fire.addEventListener(ev,()=>keys.fire=false));

function drawPlayer(){
 ctx.save();
 ctx.translate(player.x,player.y);
 ctx.shadowBlur=25;ctx.shadowColor="#00dfff";
 ctx.fillStyle="#21dfff";
 ctx.beginPath();
 ctx.moveTo(0,-25);ctx.lineTo(19,19);
 ctx.lineTo(0,12);ctx.lineTo(-19,19);
 ctx.closePath();ctx.fill();
 ctx.fillStyle="#fff";
 ctx.beginPath();ctx.arc(0,-3,5,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#ff9b38";
 ctx.fillRect(-6,19,12,9+Math.random()*9);
 ctx.restore();
}

function shoot(){
 let now=performance.now();
 if(now-lastShot<180)return;
 lastShot=now;
 bullets.push({x:player.x,y:player.y-24,v:11});
}

function spawnEnemy(){
 let r=15+Math.random()*9;
 enemies.push({
  x:Math.random()*(W-2*r)+r,y:-30,
  r,hp:Math.ceil(level/3),
  speed:1.5+Math.random()*1.3+level*.25,
  phase:Math.random()*6.28
 });
}

function explosion(x,y,color="#40dfff"){
 for(let i=0;i<18;i++){
  let a=Math.random()*Math.PI*2;
  let s=Math.random()*5+1;
  particles.push({
   x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
   life:35+Math.random()*20,color
  });
 }
}

function drawEnemy(e){
 ctx.save();
 ctx.translate(e.x,e.y);
 ctx.shadowBlur=20;ctx.shadowColor="#ff376d";
 ctx.fillStyle="#d52c63";
 ctx.beginPath();
 ctx.moveTo(0,e.r);ctx.lineTo(e.r,e.r*.35);
 ctx.lineTo(e.r*.7,-e.r);ctx.lineTo(-e.r*.7,-e.r);
 ctx.lineTo(-e.r,-e.r*.35);ctx.closePath();ctx.fill();
 ctx.fillStyle="#fff";
 ctx.fillRect(-e.r*.5,-3,e.r,5);
 ctx.restore();
}

function loop(){
 if(!running||paused)return;
 frame++;
 ctx.clearRect(0,0,W,H);

 // Background stars
 stars.forEach(s=>{
  s.y+=s.v*devicePixelRatio;
  if(s.y>H){s.y=0;s.x=Math.random()*W}
  ctx.fillStyle="#ffffff88";
  ctx.fillRect(s.x,s.y,s.s*devicePixelRatio,s.s*devicePixelRatio);
 });

 // Player movement
 let speed=player.speed*devicePixelRatio;
 if(keys.arrowup||keys.w)player.y-=speed;
 if(keys.arrowdown||keys.s)player.y+=speed;
 if(keys.arrowleft||keys.a)player.x-=speed;
 if(keys.arrowright||keys.d)player.x+=speed;
 player.x=Math.max(25,Math.min(W-25,player.x));
 player.y=Math.max(40,Math.min(H-35,player.y));
 if(keys.fire||keys[" "])shoot();

 drawPlayer();

 // Bullets
 bullets.forEach((b,i)=>{
  b.y-=b.v*devicePixelRatio;
  ctx.shadowBlur=15;ctx.shadowColor="#00eaff";
  ctx.fillStyle="#5cf8ff";
  ctx.fillRect(b.x-3,b.y,6,17);
  ctx.shadowBlur=0;
  if(b.y<0)bullets.splice(i,1);
 });

 // Enemy spawning
 spawnTimer++;
 if(spawnTimer>Math.max(22,75-level*4)){
  spawnEnemy();spawnTimer=0;
 }
 if(score>=level*150)level++;

 // Enemies
 enemies.forEach((e,i)=>{
  e.y+=e.speed*devicePixelRatio;
  e.x+=Math.sin(frame*.035+e.phase)*1.2*devicePixelRatio;
  drawEnemy(e);

  if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+16){
   explosion(e.x,e.y,"#ff416c");
   enemies.splice(i,1);health-=15;updateHUD();
   if(health<=0)endGame();
   return;
  }

  if(e.y>H+30){
   enemies.splice(i,1);health-=10;updateHUD();
   if(health<=0)endGame();
   return;
  }

  bullets.forEach((b,j)=>{
   if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+5){
    bullets.splice(j,1);e.hp--;
    if(e.hp<=0){
     explosion(e.x,e.y);
     enemies.splice(i,1);
     score+=10;updateHUD();
    }
   }
  });
 });

 // Particles
 particles.forEach((p,i)=>{
  p.x+=p.vx*devicePixelRatio;
  p.y+=p.vy*devicePixelRatio;
  p.life--;
  ctx.globalAlpha=Math.max(0,p.life/45);
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,4,4);
  ctx.globalAlpha=1;
  if(p.life<=0)particles.splice(i,1);
 });

 requestAnimationFrame(loop);
}

function endGame(){
 running=false;
 if(score>best){
  best=score;
  localStorage.setItem("galacticBest",best);
 }
 document.querySelector("#overlay h1").textContent="GAME OVER";
 document.querySelector("#overlay p").innerHTML=
 "Skor kamu: <b>"+score+"</b><br>Rekor terbaik: <b>"+best+"</b><br>Terus berlatih untuk mencapai level tertinggi!";
 const btn=document.querySelector("#overlay button");
 btn.textContent="MAIN LAGI";
 btn.onclick=startGame;
 document.getElementById("overlay").style.display="flex";
}
</script>
</body>
</html>
